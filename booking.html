<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now — Hair by London</title>
    <meta name="description" content="Choose a service and pick a time that works for you.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-frame">
        <header class="site-header site-header--split">
            <a href="index.html" class="logo" aria-label="Hair by London — Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            </a>
            <nav class="header-nav">
                <a href="index.html" class="header-nav-link">Home</a>
                <a href="portfolio.html" class="header-nav-link">Portfolio</a>
                <a href="booking.html" class="header-nav-link active">Book</a>
            </nav>
        </header>

        <main>
            <section class="page-intro">
                <h1>Book Now</h1>
            </section>

            <section class="booking-section">
                <h2>Choose your services</h2>
                <div class="service-list">
                    <label class="service-option">
                        <input type="checkbox" name="service" value="haircut" data-price="65" class="service-input">
                        <span class="service-check" aria-hidden="true"></span>
                        <span class="service-name">Haircut</span>
                        <span class="service-price">$65</span>
                    </label>
                    <label class="service-option">
                        <input type="checkbox" name="service" value="color" data-price="120" class="service-input">
                        <span class="service-check" aria-hidden="true"></span>
                        <span class="service-name">Color</span>
                        <span class="service-price">$120</span>
                    </label>
                    <label class="service-option">
                        <input type="checkbox" name="service" value="highlights" data-price="150" class="service-input">
                        <span class="service-check" aria-hidden="true"></span>
                        <span class="service-name">Highlights</span>
                        <span class="service-price">$150</span>
                    </label>
                    <label class="service-option">
                        <input type="checkbox" name="service" value="blowout" data-price="45" class="service-input">
                        <span class="service-check" aria-hidden="true"></span>
                        <span class="service-name">Blowout</span>
                        <span class="service-price">$45</span>
                    </label>
                    <label class="service-option">
                        <input type="checkbox" name="service" value="root-touch-up" data-price="80" class="service-input">
                        <span class="service-check" aria-hidden="true"></span>
                        <span class="service-name">Root Touch-Up</span>
                        <span class="service-price">$80</span>
                    </label>
                    <label class="service-option">
                        <input type="checkbox" name="service" value="deep-conditioning" data-price="35" class="service-input">
                        <span class="service-check" aria-hidden="true"></span>
                        <span class="service-name">Deep Conditioning</span>
                        <span class="service-price">$35</span>
                    </label>
                </div>
            </section>

            <section class="booking-section">
                <h2>Choose a day</h2>
                <div class="day-scroll">
                    <div class="day-chip" data-day="Tue"><span>Tue</span><span class="day-num">14</span></div>
                    <div class="day-chip" data-day="Wed"><span>Wed</span><span class="day-num">15</span></div>
                    <div class="day-chip" data-day="Thu"><span>Thu</span><span class="day-num">16</span></div>
                    <div class="day-chip" data-day="Fri"><span>Fri</span><span class="day-num">17</span></div>
                    <div class="day-chip" data-day="Sat"><span>Sat</span><span class="day-num">18</span></div>
                </div>
            </section>

            <section class="booking-section">
                <h2>Choose a time</h2>
                <div class="time-grid" id="time-grid">
                    <p class="time-placeholder">Select a day to see available times</p>
                </div>
            </section>

            <div class="confirm-bar">
                <div class="confirm-summary">
                    <span id="summary-line">Select services, day &amp; time</span>
                </div>
                <div class="confirm-summary" style="border-bottom: none; padding-bottom: 0; margin-bottom: 1.1rem;">
                    <span class="confirm-total-label">Total</span>
                    <strong id="summary-price">&mdash;</strong>
                </div>
                <button type="button" class="confirm-btn" id="confirm-btn" disabled>Continue &rarr;</button>
            </div>
        </main>

        <footer class="site-footer">
            <div class="social-links">
                <a href="#" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
                </a>
                <a href="#" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 3h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h2.5l.5-4H13V7a1 1 0 0 1 1-1h2z"/></svg>
                </a>
                <a href="#" aria-label="TikTok">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5c.36 0 .7.05 1 .15V7.7a7 7 0 1 0 6 6.93V9.5a6 6 0 0 0 3-1V5.5a5 5 0 0 1-3.5-2.5H14z"/></svg>
                </a>
            </div>
            <p>&copy; 2026 Hair by London</p>
        </footer>
    </div>

    <script>
        const state = {
            services: [],
            day: null,
            time: null
        };

        const allTimes = ['10:00', '11:30', '1:00', '2:30', '4:00', '5:30'];
        const unavailableByDay = {
            Tue: ['1:00', '5:30'],
            Wed: ['11:30'],
            Thu: ['10:00', '5:30'],
            Fri: ['1:00'],
            Sat: ['2:30', '5:30']
        };

        const summaryLine = document.getElementById('summary-line');
        const summaryPrice = document.getElementById('summary-price');
        const confirmBtn = document.getElementById('confirm-btn');
        const timeGrid = document.getElementById('time-grid');

        function updateSummary() {
            const parts = [];
            if (state.services.length) parts.push(state.services.map(s => s.name).join(' + '));
            if (state.day) parts.push(state.day);
            if (state.time) parts.push(state.time);

            summaryLine.textContent = parts.length ?
                parts.join(' \u00b7 ') :
                'Select services, day & time';

            const total = state.services.reduce((sum, s) => sum + s.price, 0);
            summaryPrice.textContent = total ? '$' + total : '\u2014';

            const allSelected = state.services.length && state.day && state.time;
            confirmBtn.disabled = !allSelected;
        }

        function renderTimeSlots(day) {
            timeGrid.innerHTML = '';
            const unavailable = unavailableByDay[day] || [];

            allTimes.forEach(time => {
                const slot = document.createElement('div');
                const isUnavailable = unavailable.includes(time);
                slot.className = 'time-slot' + (isUnavailable ? ' unavailable' : '');
                slot.textContent = time;

                if (!isUnavailable) {
                    slot.addEventListener('click', () => {
                        const prevSelected = timeGrid.querySelector('.time-slot.selected');

                        if (slot === prevSelected) {
                            slot.classList.remove('selected');
                            state.time = null;
                            updateSummary();
                            return;
                        }

                        if (prevSelected) prevSelected.classList.remove('selected');
                        slot.classList.add('selected');
                        state.time = time;
                        updateSummary();
                    });
                }

                timeGrid.appendChild(slot);
            });
        }

        document.querySelectorAll('.day-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const prevSelected = document.querySelector('.day-chip.selected');

                if (chip === prevSelected) {
                    chip.classList.remove('selected');
                    state.day = null;
                    state.time = null;
                    timeGrid.innerHTML = '<p class="time-placeholder">Select a day to see available times</p>';
                    updateSummary();
                    return;
                }

                if (prevSelected) prevSelected.classList.remove('selected');
                chip.classList.add('selected');

                state.day = chip.dataset.day;
                state.time = null;
                renderTimeSlots(state.day);
                updateSummary();
            });
        });

        document.querySelectorAll('input[name="service"]').forEach(input => {
            input.addEventListener('change', () => {
                const name = input.closest('.service-option').querySelector('.service-name').textContent;
                const price = Number(input.dataset.price);

                if (input.checked) {
                    state.services.push({
                        name,
                        price
                    });
                } else {
                    state.services = state.services.filter(s => s.name !== name);
                }
                updateSummary();
            });
        });

        confirmBtn.addEventListener('click', () => {
            confirmBtn.textContent = 'Added \u2713';
            confirmBtn.classList.add('confirm-btn--added');
            confirmBtn.disabled = true;
        });
    </script>
</body>

</html>
