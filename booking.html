<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book | Local Locks</title>
    <meta name="description" content="Choose a service and pick a time that works for you.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-frame">
        <header class="site-header site-header--booking">
            <a href="stylists.html" class="exit-btn" id="exit-btn" aria-label="Exit booking">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </a>
            <span class="booking-with" id="booking-with"></span>
            <a href="index.html" class="header-home" id="home-btn" aria-label="Local Locks, home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            </a>
        </header>

        <main>
            <!-- Step 1: services, day, time -->
            <div class="step-view" id="view-choose">
                <section class="page-intro">
                    <h1>Book Now</h1>
                </section>

                <section class="booking-section">
                    <h2>Your services</h2>
                    <!-- When she already picked services, show them as one line -->
                    <div class="service-summary" id="service-summary" hidden>
                        <div>
                            <span class="service-summary-names" id="summary-names"></span>
                            <span class="service-summary-meta" id="summary-meta"></span>
                        </div>
                        <button type="button" class="text-btn text-btn--inline" id="change-services" aria-expanded="false" aria-controls="service-list">Change</button>
                    </div>
                    <div class="service-list" id="service-list"></div>
                </section>

                <section class="booking-section">
                    <h2>Choose a day</h2>
                    <div class="day-scroll" id="day-scroll"></div>
                </section>

                <section class="booking-section">
                    <h2>Choose a time</h2>
                    <div class="time-grid" id="time-grid">
                        <p class="time-placeholder">Select a day to see available times</p>
                    </div>
                    <p class="time-note" id="time-note" hidden></p>
                </section>

                <div class="confirm-bar confirm-bar--sticky">
                    <div class="confirm-summary">
                        <span id="summary-line">Select services, day &amp; time</span>
                    </div>
                    <div class="confirm-summary confirm-summary--total">
                        <span class="confirm-total-label">Estimated total</span>
                        <strong id="summary-price">&mdash;</strong>
                    </div>
                    <p class="price-note price-note--bar" id="price-note"></p>
                    <button type="button" class="confirm-btn" id="continue-btn" disabled>Continue</button>
                </div>
            </div>

            <!-- Step 2: your details -->
            <div class="step-view" id="view-details" hidden>
                <section class="page-intro">
                    <h1 tabindex="-1" id="details-title">Your details</h1>
                </section>
                <div class="recap" id="details-recap"></div>

                <section class="booking-section">
                    <form class="form" id="details-form" novalidate>
                        <div class="field">
                            <label for="name">Name</label>
                            <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
                            <span class="field-error" id="name-error"></span>
                        </div>
                        <div class="field">
                            <label for="phone">Phone</label>
                            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required aria-describedby="phone-hint phone-error">
                            <span class="field-hint" id="phone-hint">For a reminder text the day before.</span>
                            <span class="field-error" id="phone-error"></span>
                        </div>
                    </form>
                </section>

                <div class="confirm-bar confirm-bar--sticky">
                    <button type="submit" form="details-form" class="confirm-btn">Confirm booking</button>
                </div>
            </div>

            <!-- Step 3: booked -->
            <div class="step-view" id="view-done" hidden>
                <section class="done">
                    <div class="done-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 12.5 10 17.5 19 7"/></svg>
                    </div>
                    <h1 tabindex="-1" id="done-title">You're booked</h1>
                    <p id="done-note"></p>
                </section>
                <div class="recap" id="done-recap"></div>
                <div class="done-actions">
                    <button type="button" class="confirm-btn confirm-btn--outline" id="calendar-btn">Add to calendar</button>
                    <a href="index.html" class="link-quiet">Back to home</a>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Local Locks</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const stylist = getStylist(params.get('stylist'));
        if (!stylist) {
            location.replace('stylists.html');
            throw new Error('Unknown stylist');
        }
        const firstName = stylist.name.split(' ')[0];
        document.title = 'Book with ' + firstName + ' | Local Locks';

        const state = {
            services: [], // service ids, in list order
            date: null,   // Date at midnight
            start: null   // minutes from midnight
        };

        function totalDuration() {
            return durationFor(state.services);
        }

        function totalPrice() {
            return priceFor(stylist, state.services);
        }

        /* ---------- Header ---------- */

        document.getElementById('booking-with').innerHTML =
            avatarHTML(stylist, 'sm') + '<span>Booking with <strong>' + escapeHTML(firstName) + '</strong></span>';

        const incomingServices = parseServiceIds(params.get('services') || params.get('service'))
            .filter(id => stylist.services[id] != null);

        // X goes back to the profile she came from
        const exitBtn = document.getElementById('exit-btn');
        // X goes back to wherever she came from: the search list or the profile
        exitBtn.href = params.get('from') === 'search' ?
            lastSearchUrl() :
            'stylist.html?id=' + stylist.id + (incomingServices.length ? '&' + servicesQuery(incomingServices) : '');
        // Home link in the header asks first too, so she doesn't lose her picks by accident
        document.getElementById('home-btn').addEventListener('click', e => {
            const started = state.services.length || state.date;
            const done = !document.getElementById('view-done').hidden;
            if (started && !done && !confirm('Leave booking? Your choices won’t be saved.')) {
                e.preventDefault();
            }
        });

        exitBtn.addEventListener('click', e => {
            // On the details step, this button goes back to day and time instead of leaving
            if (!document.getElementById('view-details').hidden) {
                e.preventDefault();
                history.back();
                return;
            }
            const started = state.services.length || state.date;
            const done = !document.getElementById('view-done').hidden;
            if (started && !done && !confirm('Leave booking? Your choices won\u2019t be saved.')) {
                e.preventDefault();
            }
        });

        /* ---------- Services ----------
           If she already picked services on the Stylists page, show them as
           one line with a Change button instead of the whole list again. */

        const serviceList = document.getElementById('service-list');
        const serviceSummary = document.getElementById('service-summary');
        const changeBtn = document.getElementById('change-services');

        Object.entries(stylist.services).forEach(([id, price]) => {
            const svc = SERVICES[id];
            serviceList.insertAdjacentHTML('beforeend',
                '<label class="service-option">' +
                '<input type="checkbox" name="service" value="' + id + '" class="service-input">' +
                '<span class="service-check" aria-hidden="true"></span>' +
                '<span class="service-body">' +
                '<span class="service-name">' + svc.name + '</span>' +
                '<span class="service-desc">' + svc.description + '</span>' +
                '</span>' +
                '<span class="service-meta">' + formatDuration(svc.duration) + ' \u00b7 ' + priceText(price) + '</span>' +
                '</label>');
        });

        const serviceOrder = Object.keys(stylist.services);

        serviceList.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', () => {
                const picked = new Set(state.services);
                if (input.checked) picked.add(input.value);
                else picked.delete(input.value);
                state.services = serviceOrder.filter(id => picked.has(id));
                if (state.date) renderTimes();
                updateSummary();
            });
        });

        incomingServices.forEach(id => {
            const input = serviceList.querySelector('input[value="' + id + '"]');
            if (input) input.checked = true;
        });
        state.services = serviceOrder.filter(id => incomingServices.includes(id));

        function renderServiceSummary() {
            document.getElementById('summary-names').textContent = state.services.map(id => SERVICES[id].name).join(' + ');
            document.getElementById('summary-meta').textContent =
                priceText(totalPrice()) + ' \u00b7 about ' + formatDuration(totalDuration());
        }

        if (state.services.length) {
            serviceSummary.hidden = false;
            serviceList.hidden = true;
            renderServiceSummary();
        }

        changeBtn.addEventListener('click', () => {
            const opening = serviceList.hidden;
            serviceList.hidden = !opening;
            changeBtn.textContent = opening ? 'Done' : 'Change';
            changeBtn.setAttribute('aria-expanded', opening);
            if (!opening && !state.services.length) {
                // Nothing picked, so keep the list open
                serviceList.hidden = false;
                changeBtn.textContent = 'Done';
                changeBtn.setAttribute('aria-expanded', 'true');
            }
            renderServiceSummary();
        });

        /* ---------- Days ---------- */

        const dayScroll = document.getElementById('day-scroll');
        const dayChips = [];

        function selectDay(date) {
            dayChips.forEach(({ chip, date: d }) => {
                const on = date && dateKey(d) === dateKey(date);
                chip.classList.toggle('selected', on);
                chip.setAttribute('aria-pressed', on);
            });
            state.date = date;
        }

        upcomingDays().filter(d => stylist.workDays.includes(d.getDay())).forEach(date => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'day-chip';
            chip.setAttribute('aria-pressed', 'false');
            chip.setAttribute('aria-label', formatDay(date));
            chip.innerHTML = '<span>' + WEEKDAYS[date.getDay()] + '</span>' +
                '<span class="day-num">' + date.getDate() + '</span>' +
                '<span class="day-month">' + MONTHS[date.getMonth()] + '</span>';

            chip.addEventListener('click', () => {
                const wasSelected = chip.classList.contains('selected');
                state.start = null;
                bumpedTime = null;
                selectDay(wasSelected ? null : date);
                renderTimes();
                updateSummary();
            });
            dayChips.push({ chip, date });
            dayScroll.appendChild(chip);
        });

        /* ---------- Times ---------- */

        const timeGrid = document.getElementById('time-grid');
        const timeNote = document.getElementById('time-note');
        let bumpedTime = null; // a time she picked that stopped fitting after a service change

        function renderTimes() {
            timeGrid.innerHTML = '';
            if (!state.date) {
                timeGrid.innerHTML = '<p class="time-placeholder">Select a day to see available times</p>';
                return;
            }

            const duration = Math.max(totalDuration(), STEP);
            if (state.start != null && !isStartAvailable(stylist, state.date, state.start, duration)) {
                // Services changed and the old time no longer fits. Say so instead of clearing it quietly.
                bumpedTime = state.start;
                state.start = null;
            }

            let openCount = 0;
            for (let start = OPEN; start < CLOSE; start += STEP) {
                const open = isStartAvailable(stylist, state.date, start, duration);
                if (open) openCount++;

                const slot = document.createElement('button');
                slot.type = 'button';
                slot.className = 'time-slot' + (open ? '' : ' unavailable') + (start === state.start ? ' selected' : '');
                slot.textContent = formatTime(start);
                slot.disabled = !open;
                slot.setAttribute('aria-pressed', start === state.start);

                slot.addEventListener('click', () => {
                    bumpedTime = null;
                    state.start = state.start === start ? null : start;
                    renderTimes();
                    updateSummary();
                });
                timeGrid.appendChild(slot);
            }

            if (!openCount) {
                timeGrid.insertAdjacentHTML('afterbegin',
                    '<p class="time-placeholder">No openings long enough on this day. Try another day.</p>');
            }
        }

        // A time she tapped on the Stylists page comes in already picked
        // A day she picked comes in selected too, even without a time
        const heldDate = parseDateKey(params.get('date'));
        const heldStart = params.get('start') == null ? NaN : Number(params.get('start'));
        if (heldDate && stylist.workDays.includes(heldDate.getDay()) &&
            dayChips.some(c => dateKey(c.date) === dateKey(heldDate))) {
            selectDay(heldDate);
            if (Number.isFinite(heldStart) &&
                isStartAvailable(stylist, heldDate, heldStart, Math.max(totalDuration(), STEP))) {
                state.start = heldStart;
            }
            renderTimes();
            const sel = dayScroll.querySelector('.selected');
            if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'center' });
        }

        /* ---------- Summary ---------- */

        const summaryLine = document.getElementById('summary-line');
        const summaryPrice = document.getElementById('summary-price');
        const priceNote = document.getElementById('price-note');
        const continueBtn = document.getElementById('continue-btn');

        function whenText() {
            const end = state.start + totalDuration();
            return formatDay(state.date) + ', ' + formatRange(state.start, end);
        }

        function updateSummary() {
            const parts = [];
            if (state.services.length) parts.push(state.services.map(id => SERVICES[id].name).join(' + '));
            if (state.date) parts.push(formatDay(state.date));
            if (state.start != null) {
                parts.push(state.services.length ?
                    formatRange(state.start, state.start + totalDuration()) :
                    formatTime(state.start));
            }
            summaryLine.textContent = parts.length ? parts.join(' \u00b7 ') : 'Select services, day & time';

            const total = totalPrice();
            summaryPrice.textContent = total ? priceText(total) + ' \u00b7 about ' + formatDuration(totalDuration()) : '\u2014';
            priceNote.textContent = total ?
                'Starting price. Longer or thicker hair can cost more, and ' + firstName + ' will confirm it with you.' : '';
            priceNote.hidden = !total;

            timeNote.classList.toggle('time-note--warn', bumpedTime != null && state.start == null);
            if (bumpedTime != null && state.start == null) {
                timeNote.hidden = false;
                timeNote.textContent = formatTime(bumpedTime) + ' doesn’t leave enough time for everything you picked. Choose another time.';
            } else if (state.start != null && state.services.length) {
                timeNote.hidden = false;
                timeNote.textContent = 'You\u2019ll be done by about ' + formatTime(state.start + totalDuration()) + '.';
            } else if (state.date && !state.services.length) {
                timeNote.hidden = false;
                timeNote.textContent = 'Pick a service to see when you\u2019ll be done.';
            } else {
                timeNote.hidden = true;
            }

            continueBtn.disabled = !(state.services.length && state.date && state.start != null);
        }

        /* ---------- Steps ---------- */

        const views = {
            choose: document.getElementById('view-choose'),
            details: document.getElementById('view-details'),
            done: document.getElementById('view-done')
        };

        const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';
        const BACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><polyline points="15 6 9 12 15 18"/></svg>';

        function showView(name, focusId) {
            Object.entries(views).forEach(([k, el]) => el.hidden = k !== name);
            window.scrollTo(0, 0);
            if (focusId) document.getElementById(focusId).focus();

            // Back arrow on the details step, X everywhere else
            const onDetails = name === 'details';
            exitBtn.innerHTML = onDetails ? BACK_ICON : X_ICON;
            exitBtn.setAttribute('aria-label', onDetails ? 'Back to day and time' : 'Exit booking');
        }

        // Each step gets its own history entry, so swiping back on a phone
        // goes back one step instead of leaving the booking.
        history.replaceState({ step: 'choose' }, '');
        window.addEventListener('popstate', e => {
            const step = e.state && e.state.step;
            if (!views.done.hidden) return; // already booked: let back leave normally
            if (step === 'details' && state.start != null) showView('details', 'details-title');
            else showView('choose');
        });

        function recapHTML(extraRows = []) {
            const rows = [
                ['Stylist', escapeHTML(stylist.name) + ', ' + escapeHTML(stylist.studio)],
                ['Services', state.services.map(id => SERVICES[id].name).join(' + ')],
                ['When', whenText()],
                ['Estimated total', priceText(totalPrice()) + ', about ' + formatDuration(totalDuration())],
                ...extraRows
            ];
            return rows.map(([k, v]) => '<div class="recap-row"><span>' + k + '</span><span>' + v + '</span></div>').join('');
        }

        continueBtn.addEventListener('click', () => {
            document.getElementById('details-recap').innerHTML = recapHTML();
            history.pushState({ step: 'details' }, '');
            showView('details', 'details-title');
        });


        /* ---------- Details form ---------- */

        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');

        function phoneDigits(value) {
            const digits = value.replace(/\D/g, '');
            return digits.length === 11 && digits[0] === '1' ? digits.slice(1) : digits;
        }

        function formatPhone(digits) {
            return '(' + digits.slice(0, 3) + ') ' + digits.slice(3, 6) + '-' + digits.slice(6);
        }

        function setError(input, id, message) {
            document.getElementById(id).textContent = message;
            input.setAttribute('aria-invalid', message ? 'true' : 'false');
        }

        document.getElementById('details-form').addEventListener('submit', e => {
            e.preventDefault();
            const name = nameInput.value.trim();
            const digits = phoneDigits(phoneInput.value);

            setError(nameInput, 'name-error', name ? '' : 'Enter your name so ' + firstName + ' knows who\u2019s coming.');
            setError(phoneInput, 'phone-error', digits.length === 10 ? '' : 'Enter a 10-digit phone number.');
            if (!name) return nameInput.focus();
            if (digits.length !== 10) return phoneInput.focus();

            state.name = name;
            state.phone = formatPhone(digits);

            document.getElementById('done-note').textContent =
                'A reminder text will go to ' + state.phone + ' the day before.';
            document.getElementById('done-recap').innerHTML = recapHTML([['Name', escapeHTML(name)]]);
            showView('done', 'done-title');
        });

        /* ---------- Add to calendar (.ics file) ---------- */

        function icsStamp(date, mins) {
            const d = new Date(date);
            d.setHours(0, mins, 0, 0);
            const p = n => String(n).padStart(2, '0');
            return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + 'T' + p(d.getHours()) + p(d.getMinutes()) + '00';
        }

        document.getElementById('calendar-btn').addEventListener('click', () => {
            const services = state.services.map(id => SERVICES[id].name).join(' + ');
            const ics = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Local Locks//Booking//EN',
                'BEGIN:VEVENT',
                'UID:' + Date.now() + '@locallocks',
                'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z',
                'DTSTART:' + icsStamp(state.date, state.start),
                'DTEND:' + icsStamp(state.date, state.start + totalDuration()),
                'SUMMARY:' + services + ' with ' + firstName,
                'LOCATION:' + stylist.studio + '\\, ' + stylist.city,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = 'hair-appointment.ics';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        updateSummary();
    </script>
    <script src="prototype-notice.js"></script>
</body>

</html>
