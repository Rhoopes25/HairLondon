<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book | Hair by London</title>
    <meta name="description" content="Choose a service and pick a time that works for you.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-frame">
        <header class="site-header site-header--booking">
            <a href="stylists.html" class="exit-btn" id="exit-btn" aria-label="Exit booking">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </a>
            <span class="booking-with" id="booking-with"></span>
            <span class="header-spacer" aria-hidden="true"></span>
        </header>

        <main>
            <!-- Step 1: services, day, time -->
            <div class="step-view" id="view-choose">
                <section class="page-intro">
                    <h1>Book Now</h1>
                </section>

                <section class="booking-section">
                    <h2>Choose your services</h2>
                    <div class="service-list" id="service-list"></div>
                </section>

                <section class="booking-section">
                    <h2>Choose a day</h2>
                    <div class="day-scroll" id="day-scroll"></div>
                </section>

                <section class="booking-section">
                    <h2>Choose a time</h2>
                    <div class="time-grid" id="time-grid">
                        <p class="time-placeholder">Select a day to see available times</p>
                    </div>
                    <p class="time-note" id="time-note" hidden></p>
                </section>

                <div class="confirm-bar">
                    <div class="confirm-summary">
                        <span id="summary-line">Select services, day &amp; time</span>
                    </div>
                    <div class="confirm-summary" style="border-bottom: none; padding-bottom: 0; margin-bottom: 1.1rem;">
                        <span class="confirm-total-label">Total</span>
                        <strong id="summary-price">&mdash;</strong>
                    </div>
                    <button type="button" class="confirm-btn" id="continue-btn" disabled>Continue</button>
                </div>
            </div>

            <!-- Step 2: your details -->
            <div class="step-view" id="view-details" hidden>
                <section class="page-intro">
                    <h1 tabindex="-1" id="details-title">Your details</h1>
                </section>
                <div class="recap" id="details-recap"></div>

                <section class="booking-section">
                    <form class="form" id="details-form" novalidate>
                        <div class="field">
                            <label for="name">Name</label>
                            <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
                            <span class="field-error" id="name-error"></span>
                        </div>
                        <div class="field">
                            <label for="phone">Phone</label>
                            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required aria-describedby="phone-hint phone-error">
                            <span class="field-hint" id="phone-hint">For a reminder text the day before.</span>
                            <span class="field-error" id="phone-error"></span>
                        </div>
                    </form>
                </section>

                <div class="confirm-bar">
                    <button type="submit" form="details-form" class="confirm-btn">Confirm booking</button>
                    <button type="button" class="text-btn" id="back-btn">Back</button>
                </div>
            </div>

            <!-- Step 3: booked -->
            <div class="step-view" id="view-done" hidden>
                <section class="done">
                    <div class="done-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 12.5 10 17.5 19 7"/></svg>
                    </div>
                    <h1 tabindex="-1" id="done-title">You're booked</h1>
                    <p id="done-note"></p>
                </section>
                <div class="recap" id="done-recap"></div>
                <div class="done-actions">
                    <button type="button" class="confirm-btn confirm-btn--outline" id="calendar-btn">Add to calendar</button>
                    <a href="index.html" class="link-quiet">Back to home</a>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="social-links">
                <a href="#" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
                </a>
                <a href="#" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 3h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h2.5l.5-4H13V7a1 1 0 0 1 1-1h2z"/></svg>
                </a>
                <a href="#" aria-label="TikTok">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5c.36 0 .7.05 1 .15V7.7a7 7 0 1 0 6 6.93V9.5a6 6 0 0 0 3-1V5.5a5 5 0 0 1-3.5-2.5H14z"/></svg>
                </a>
            </div>
            <p>&copy; 2026 Hair by London</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const stylist = getStylist(params.get('stylist'));
        if (!stylist) {
            location.replace('stylists.html');
            throw new Error('Unknown stylist');
        }
        const firstName = stylist.name.split(' ')[0];
        document.title = 'Book with ' + firstName + ' | Hair by London';

        // Salon hours in minutes from midnight. Slots start every 30 min.
        const OPEN = 9 * 60;
        const CLOSE = 18 * 60;
        const STEP = 30;
        const DAYS_AHEAD = 21;

        const state = {
            services: [], // service ids, in the order they were picked
            date: null,   // Date at midnight
            start: null   // minutes from midnight
        };

        /* ---------- Formatting ---------- */

        const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        function formatTime(mins, withPeriod = true) {
            const h24 = Math.floor(mins / 60);
            const m = mins % 60;
            const h12 = h24 % 12 || 12;
            const period = h24 < 12 ? 'AM' : 'PM';
            return h12 + ':' + String(m).padStart(2, '0') + (withPeriod ? ' ' + period : '');
        }

        function formatRange(start, end) {
            // "1:00 to 2:30 PM", or "11:00 AM to 12:30 PM" when it crosses noon
            const samePeriod = (start < 720) === (end < 720);
            return formatTime(start, !samePeriod) + ' to ' + formatTime(end);
        }

        function formatDay(date) {
            return WEEKDAYS[date.getDay()] + ', ' + MONTHS[date.getMonth()] + ' ' + date.getDate();
        }

        function dateKey(date) {
            return date.getFullYear() + '-' + (date.getMonth() + 1) + '-' + date.getDate();
        }

        function totalDuration() {
            return state.services.reduce((sum, id) => sum + SERVICES[id].duration, 0);
        }

        function totalPrice() {
            return state.services.reduce((sum, id) => sum + stylist.services[id], 0);
        }

        /* ---------- Sample availability ----------
           Until there's a real calendar, each stylist gets a steady,
           made-up set of booked half hours per day. The same day always
           shows the same openings. */

        function hash(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function isBlockBooked(date, mins) {
            return hash(stylist.id + dateKey(date) + mins) % 100 < 20;
        }

        function isStartAvailable(date, start, duration) {
            if (start + duration > CLOSE) return false;
            const now = new Date();
            if (dateKey(date) === dateKey(now) && start <= now.getHours() * 60 + now.getMinutes() + 60) return false;
            for (let t = start; t < start + duration; t += STEP) {
                if (isBlockBooked(date, t)) return false;
            }
            return true;
        }

        /* ---------- Header ---------- */

        document.getElementById('booking-with').innerHTML =
            avatarHTML(stylist, 'sm') + '<span>Booking with <strong>' + escapeHTML(firstName) + '</strong></span>';

        const exitBtn = document.getElementById('exit-btn');
        const incomingServices = parseServiceIds(params.get('services'));
        const singlePreset = params.get('service');
        if (singlePreset && SERVICES[singlePreset] && !incomingServices.includes(singlePreset)) {
            incomingServices.push(singlePreset);
        }

        exitBtn.href = 'stylist.html?id=' + stylist.id + (incomingServices.length ? '&' + servicesQuery(incomingServices) : '');
        exitBtn.addEventListener('click', e => {
            const started = state.services.length || state.date;
            const done = !document.getElementById('view-done').hidden;
            if (started && !done && !confirm('Leave booking? Your choices won\u2019t be saved.')) {
                e.preventDefault();
            }
        });

        /* ---------- Services ---------- */

        const serviceList = document.getElementById('service-list');
        Object.entries(stylist.services).forEach(([id, price]) => {
            const svc = SERVICES[id];
            serviceList.insertAdjacentHTML('beforeend',
                '<label class="service-option">' +
                '<input type="checkbox" name="service" value="' + id + '" class="service-input">' +
                '<span class="service-check" aria-hidden="true"></span>' +
                '<span class="service-body">' +
                '<span class="service-name">' + svc.name + '</span>' +
                '<span class="service-desc">' + svc.description + '</span>' +
                '</span>' +
                '<span class="service-meta">' + formatDuration(svc.duration) + ' \u00b7 $' + price + '</span>' +
                '</label>');
        });

        serviceList.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', () => {
                if (input.checked) state.services.push(input.value);
                else state.services = state.services.filter(id => id !== input.value);
                if (state.date) renderTimes();
                updateSummary();
            });
        });

        incomingServices.forEach(id => {
            if (stylist.services[id] == null) return;
            const input = serviceList.querySelector('input[value="' + id + '"]');
            if (!input || input.checked) return;
            input.checked = true;
            state.services.push(id);
        });

        /* ---------- Days ---------- */

        const dayScroll = document.getElementById('day-scroll');
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        for (let i = 0; i < DAYS_AHEAD; i++) {
            const date = new Date(today);
            date.setDate(today.getDate() + i);
            if (!stylist.workDays.includes(date.getDay())) continue;

            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'day-chip';
            chip.setAttribute('aria-pressed', 'false');
            chip.setAttribute('aria-label', formatDay(date));
            chip.innerHTML = '<span>' + WEEKDAYS[date.getDay()] + '</span>' +
                '<span class="day-num">' + date.getDate() + '</span>' +
                '<span class="day-month">' + MONTHS[date.getMonth()] + '</span>';

            chip.addEventListener('click', () => {
                const wasSelected = chip.classList.contains('selected');
                dayScroll.querySelectorAll('.day-chip').forEach(c => {
                    c.classList.remove('selected');
                    c.setAttribute('aria-pressed', 'false');
                });
                state.start = null;
                if (wasSelected) {
                    state.date = null;
                } else {
                    chip.classList.add('selected');
                    chip.setAttribute('aria-pressed', 'true');
                    state.date = date;
                }
                renderTimes();
                updateSummary();
            });
            dayScroll.appendChild(chip);
        }

        /* ---------- Times ---------- */

        const timeGrid = document.getElementById('time-grid');
        const timeNote = document.getElementById('time-note');

        function renderTimes() {
            timeGrid.innerHTML = '';
            if (!state.date) {
                timeGrid.innerHTML = '<p class="time-placeholder">Select a day to see available times</p>';
                return;
            }

            const duration = Math.max(totalDuration(), STEP);
            if (state.start != null && !isStartAvailable(state.date, state.start, duration)) {
                state.start = null; // services changed and the old time no longer fits
            }

            let openCount = 0;
            for (let start = OPEN; start < CLOSE; start += STEP) {
                const open = isStartAvailable(state.date, start, duration);
                if (open) openCount++;

                const slot = document.createElement('button');
                slot.type = 'button';
                slot.className = 'time-slot' + (open ? '' : ' unavailable') + (start === state.start ? ' selected' : '');
                slot.textContent = formatTime(start);
                slot.disabled = !open;
                slot.setAttribute('aria-pressed', start === state.start);

                slot.addEventListener('click', () => {
                    state.start = state.start === start ? null : start;
                    renderTimes();
                    updateSummary();
                });
                timeGrid.appendChild(slot);
            }

            if (!openCount) {
                timeGrid.insertAdjacentHTML('afterbegin',
                    '<p class="time-placeholder">No openings long enough on this day. Try another day.</p>');
            }
        }

        /* ---------- Summary ---------- */

        const summaryLine = document.getElementById('summary-line');
        const summaryPrice = document.getElementById('summary-price');
        const continueBtn = document.getElementById('continue-btn');

        function whenText() {
            const end = state.start + totalDuration();
            return formatDay(state.date) + ', ' + formatRange(state.start, end);
        }

        function updateSummary() {
            const parts = [];
            if (state.services.length) parts.push(state.services.map(id => SERVICES[id].name).join(' + '));
            if (state.date) parts.push(formatDay(state.date));
            if (state.start != null) {
                parts.push(state.services.length ?
                    formatRange(state.start, state.start + totalDuration()) :
                    formatTime(state.start));
            }
            summaryLine.textContent = parts.length ? parts.join(' \u00b7 ') : 'Select services, day & time';

            const total = totalPrice();
            summaryPrice.textContent = total ? '$' + total + ' \u00b7 ' + formatDuration(totalDuration()) : '\u2014';

            if (state.start != null && state.services.length) {
                timeNote.hidden = false;
                timeNote.textContent = 'You\u2019ll be done by ' + formatTime(state.start + totalDuration()) + '.';
            } else if (state.date && !state.services.length) {
                timeNote.hidden = false;
                timeNote.textContent = 'Pick a service to see when you\u2019ll be done.';
            } else {
                timeNote.hidden = true;
            }

            continueBtn.disabled = !(state.services.length && state.date && state.start != null);
        }

        /* ---------- Steps ---------- */

        const views = {
            choose: document.getElementById('view-choose'),
            details: document.getElementById('view-details'),
            done: document.getElementById('view-done')
        };

        function showView(name, focusId) {
            Object.entries(views).forEach(([k, el]) => el.hidden = k !== name);
            window.scrollTo(0, 0);
            if (focusId) document.getElementById(focusId).focus();
        }

        function recapHTML(extraRows = []) {
            const rows = [
                ['Stylist', escapeHTML(stylist.name) + ', ' + escapeHTML(stylist.studio)],
                ['Services', state.services.map(id => SERVICES[id].name).join(' + ')],
                ['When', whenText()],
                ['Total', '$' + totalPrice()],
                ...extraRows
            ];
            return rows.map(([k, v]) => '<div class="recap-row"><span>' + k + '</span><span>' + v + '</span></div>').join('');
        }

        continueBtn.addEventListener('click', () => {
            document.getElementById('details-recap').innerHTML = recapHTML();
            showView('details', 'details-title');
        });

        document.getElementById('back-btn').addEventListener('click', () => showView('choose'));

        /* ---------- Details form ---------- */

        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');

        function phoneDigits(value) {
            const digits = value.replace(/\D/g, '');
            return digits.length === 11 && digits[0] === '1' ? digits.slice(1) : digits;
        }

        function formatPhone(digits) {
            return '(' + digits.slice(0, 3) + ') ' + digits.slice(3, 6) + '-' + digits.slice(6);
        }

        function setError(input, id, message) {
            document.getElementById(id).textContent = message;
            input.setAttribute('aria-invalid', message ? 'true' : 'false');
        }

        document.getElementById('details-form').addEventListener('submit', e => {
            e.preventDefault();
            const name = nameInput.value.trim();
            const digits = phoneDigits(phoneInput.value);

            setError(nameInput, 'name-error', name ? '' : 'Enter your name so ' + firstName + ' knows who\u2019s coming.');
            setError(phoneInput, 'phone-error', digits.length === 10 ? '' : 'Enter a 10-digit phone number.');
            if (!name) return nameInput.focus();
            if (digits.length !== 10) return phoneInput.focus();

            state.name = name;
            state.phone = formatPhone(digits);

            document.getElementById('done-note').textContent =
                'A reminder text will go to ' + state.phone + ' the day before.';
            document.getElementById('done-recap').innerHTML = recapHTML([['Name', escapeHTML(name)]]);
            showView('done', 'done-title');
        });

        /* ---------- Add to calendar (.ics file) ---------- */

        function icsStamp(date, mins) {
            const d = new Date(date);
            d.setHours(0, mins, 0, 0);
            const p = n => String(n).padStart(2, '0');
            return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + 'T' + p(d.getHours()) + p(d.getMinutes()) + '00';
        }

        document.getElementById('calendar-btn').addEventListener('click', () => {
            const services = state.services.map(id => SERVICES[id].name).join(' + ');
            const ics = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Hair by London//Booking//EN',
                'BEGIN:VEVENT',
                'UID:' + Date.now() + '@hairbylondon',
                'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z',
                'DTSTART:' + icsStamp(state.date, state.start),
                'DTEND:' + icsStamp(state.date, state.start + totalDuration()),
                'SUMMARY:' + services + ' with ' + firstName,
                'LOCATION:' + stylist.studio + '\\, ' + stylist.city,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = 'hair-appointment.ics';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        updateSummary();
    </script>
</body>

</html>
