# Example server block for any host that serves dist/ itself.
# Needed only when VITE_ROUTER_MODE=browser. Hash routing needs no fallback.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
