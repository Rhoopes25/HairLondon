<!-- @dsCard group="Actions" height=330 subtitle="Filled, disabled, hero" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:24px;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:420px;display:grid;gap:var(--space-5)}
.cap{font-size:.75rem;color:var(--ink-soft);margin:0 0 .4rem}
.fill{display:block;width:100%;font:500 .95rem/1.6 var(--font-sans);letter-spacing:.02em;color:var(--white);background:var(--gold-deep);padding:.95rem;border:0;border-radius:var(--radius-pill);cursor:pointer;transition:background .2s ease}
.fill:hover{background:var(--ink)}
.fill.ai{background:var(--gold-ink)}
.fill:disabled{background:var(--cream-deep);color:var(--ink-soft);cursor:not-allowed}
.book{font:500 .8rem/1.6 var(--font-sans);letter-spacing:.03em;color:var(--white);background:var(--gold-deep);padding:.55rem 1.1rem;border:0;border-radius:var(--radius-pill);white-space:nowrap;cursor:pointer}
.book:hover{background:var(--ink)}
.photo{background:linear-gradient(145deg,var(--photo-light),var(--photo-deep));border-radius:var(--radius-md);padding:1.5rem;text-align:center}
.hero{display:inline-block;font:500 .85rem/1.6 var(--font-sans);letter-spacing:.03em;color:var(--ink);background:var(--white);padding:.75rem 1.6rem;border:0;border-radius:var(--radius-pill);cursor:pointer;transition:transform .15s ease,background .2s ease}
.hero:hover{background:var(--gold-soft);transform:translateY(-1px)}
button:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
</style></head><body>
<div><p class="cap">Filled (gold-ink, the site default)</p><button class="fill ai">Continue</button></div>
<div><p class="cap">Disabled</p><button class="fill" disabled>Continue</button></div>
<div><p class="cap">Hero button, on a photo</p><div class="photo"><button class="hero">Find a stylist</button></div></div>
</body></html>
