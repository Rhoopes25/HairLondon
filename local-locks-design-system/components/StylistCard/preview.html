<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:20px 1.5rem;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.5;max-width:460px}
.card{display:flex;flex-direction:column;gap:.85rem;padding:1.1rem;background:var(--white);border:1.5px solid var(--cream-deep);border-radius:var(--radius-md)}
.top{display:flex;align-items:center;gap:.9rem}
.av{width:3.2rem;height:3.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(145deg,var(--photo-light),var(--photo-deep));color:var(--white);font-family:var(--font-display);font-style:italic;font-weight:600;font-size:1.2rem}
.body{flex:1;display:flex;flex-direction:column}
.nm{font-family:var(--font-display);font-size:1.25rem;font-weight:600;line-height:1.2}
.st,.rt{font-size:.8rem;color:var(--ink-soft)}
.stars{color:var(--gold-deep)}
.pw{text-align:right}.pr{font-family:var(--font-display);font-size:1.3rem;font-weight:600;line-height:1.1}.pn{display:block;font-size:.72rem;color:var(--ink-soft)}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}.th span{aspect-ratio:1;border-radius:var(--radius-sm);background:linear-gradient(145deg,var(--photo-light),var(--photo-deep))}
.lbl{font-size:.8rem;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.slot{font-size:.78rem;color:var(--gold-ink);background:var(--cream);border:1.5px solid var(--gold-soft);border-radius:var(--radius-pill);padding:.35rem .8rem;text-decoration:none}
.th .more{position:relative}.th .more a{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(43,36,32,.45);color:var(--white);font-size:.8rem;font-weight:600;line-height:1.3;border-radius:inherit;text-decoration:none}
</style></head><body>
<article class="card">
 <div class="top"><span class="av">SM</span><div class="body"><span class="nm">Sadie Morgan</span><span class="st">Juniper Hair Studio, Orem</span><span class="rt"><span class="stars">★★★★★</span> 5.0 · 2 reviews</span></div><div class="pw"><span class="pr">$55+</span><span class="pn">about 1 hr</span></div></div>
 <div class="th"><span></span><span></span><span class="more"><a href="#">See all<br>work →</a></span></div>
 <div><span class="lbl">Next open</span><div class="row"><a class="slot" href="#">Today, 1:00 PM</a><a class="slot" href="#">Today, 1:30 PM</a><a class="slot" href="#">Sat 10, 9:00 AM</a></div></div>
</article>
</body></html>
