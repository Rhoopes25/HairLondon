<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:24px 1.25rem;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:460px}
.photo{aspect-ratio:4/4.3;border-radius:var(--radius-xl);background:linear-gradient(145deg,var(--photo-light),var(--photo-deep))}
.txt{display:flex;flex-direction:column;align-items:center;text-align:center;padding:1.6rem 1rem 1rem}
h1{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:3rem;line-height:1.15;margin:0 0 .15rem}
p{margin:0 0 1.3rem;color:var(--ink-soft)}
.cta{font-size:.85rem;font-weight:500;letter-spacing:.03em;color:var(--white);background:var(--gold-ink);padding:.75rem 1.6rem;border-radius:var(--radius-pill);text-decoration:none}
.note{font-size:.72rem;color:var(--ink-soft);text-align:center;margin:0}
</style></head><body>
<div class="photo" role="img" aria-label="A stylist holding her shears"></div>
<div class="txt"><h1>Local Locks</h1><p>Local stylists you can trust.</p><a href="#" class="cta">Find a stylist</a></div>
<p class="note">A warm gradient stands in for home.jpg.</p>
</body></html>
