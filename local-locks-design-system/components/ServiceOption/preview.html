<!-- @dsCard group="Booking" height=260 subtitle="White row with round check: resting, chosen" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:24px 1.5rem;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:460px}
.list{display:flex;flex-direction:column;gap:.65rem}
.opt{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.1rem;background:var(--white);border:1.5px solid var(--cream-deep);border-radius:var(--radius-md);cursor:pointer;transition:border-color .15s ease,background .15s ease}
.opt input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);margin:-1px;border:0;padding:0}
.chk{width:24px;height:24px;border-radius:var(--radius-round);border:1.5px solid var(--cream-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s ease,border-color .15s ease}
.chk::after{content:'\2713';color:var(--white);font-size:.75rem;opacity:0}
.nm{font-size:.92rem;font-weight:500;flex:1}
.pr{font-size:.8rem;color:var(--ink-soft)}
.opt:has(input:checked){border-color:var(--gold-deep)}
.opt:has(input:checked) .chk{background:var(--gold-deep);border-color:var(--gold-deep)}
.opt:has(input:checked) .chk::after{opacity:1}
.opt:has(input:focus-visible) .chk{outline:2px solid var(--gold-deep);outline-offset:2px}
</style></head><body>
<div class="list">
  <label class="opt"><input type="checkbox"><span class="chk"></span><span class="nm">Haircut</span><span class="pr">$65</span></label>
  <label class="opt"><input type="checkbox" checked><span class="chk"></span><span class="nm">Color</span><span class="pr">$120</span></label>
  <label class="opt"><input type="checkbox"><span class="chk"></span><span class="nm">Highlights</span><span class="pr">$150</span></label>
  <label class="opt"><input type="checkbox"><span class="chk"></span><span class="nm">Root Touch-Up</span><span class="pr">$80</span></label>
</div>
</body></html>
