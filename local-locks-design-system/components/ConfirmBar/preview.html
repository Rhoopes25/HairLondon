<!-- @dsCard group="Booking" height=420 subtitle="Sticky: summary, estimated total, Continue" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:24px 0;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:460px;display:grid;gap:var(--space-5)}
.cap{font-size:.75rem;color:var(--ink-soft);margin:0 1.5rem .4rem}
.bar{padding:1.5rem;background:var(--white);border-top:1px solid var(--gold-soft)}
.sum{display:flex;align-items:baseline;justify-content:space-between;font-size:.85rem;color:var(--ink-soft);margin-bottom:1.1rem;padding-bottom:1rem;border-bottom:1px solid var(--cream-deep)}
.tot{display:flex;align-items:baseline;justify-content:space-between;font-size:.85rem;color:var(--ink-soft);margin-bottom:1.1rem}
.tot .l{font-weight:500;color:var(--ink)}
.tot strong{color:var(--ink);font-weight:500;font-size:.95rem}
.btn{display:block;width:100%;text-align:center;font:500 .95rem/1.6 var(--font-sans);letter-spacing:.02em;color:var(--white);background:var(--gold-deep);padding:.95rem;border:0;border-radius:var(--radius-pill);cursor:pointer;transition:background .2s ease}
.btn:hover{background:var(--ink)}
.btn:disabled{background:var(--cream-deep);color:var(--ink-soft);cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
</style></head><body>
<div><p class="cap">Nothing chosen yet</p>
<div class="bar"><div class="sum"><span>Select services, day &amp; time</span></div>
<div class="tot"><span class="l">Estimated total</span><strong>&mdash;</strong></div>
<button class="btn" disabled>Continue</button></div></div>
<div><p class="cap">Ready</p>
<div class="bar"><div class="sum"><span>Haircut + Color &middot; Thu, Oct 16 &middot; 2:30 to 5:30 PM</span></div>
<div class="tot"><span class="l">Estimated total</span><strong>$185+ &middot; about 3 hr</strong></div>
<button class="btn">Continue</button></div></div>
</body></html>
