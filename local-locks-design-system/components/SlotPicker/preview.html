<!-- @dsCard group="Booking" height=360 subtitle="Day chips and time slots: resting, chosen, unavailable" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:24px 1.5rem;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:460px}
h2{font:600 1.15rem/1.6 var(--font-display);margin:0 0 .9rem}
.days{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:1.6rem;scrollbar-width:none}
.day{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.65rem .9rem;border-radius:var(--radius-md);border:1.5px solid var(--cream-deep);background:var(--white);cursor:pointer;font:400 .75rem/1.6 var(--font-sans);color:var(--ink-soft)}
.day .n{font:600 1.25rem/1.6 var(--font-display);color:inherit}
.day[aria-pressed="true"]{border-color:var(--gold-deep);background:var(--gold-deep);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.slot{padding:.65rem .4rem;text-align:center;border-radius:var(--radius-sm);border:1.5px solid var(--cream-deep);background:var(--white);font:400 .82rem/1.6 var(--font-sans);color:var(--ink);cursor:pointer}
.slot[aria-pressed="true"]{border-color:var(--gold-deep);background:var(--gold-soft);font-weight:500}
.slot:disabled{color:var(--unavailable);background:var(--cream-deep);border-color:var(--cream-deep);text-decoration:line-through;cursor:not-allowed}
.day:focus-visible,.slot:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.mo{display:block;font-size:.65rem}
</style></head><body>
<h2>Choose a day</h2>
<div class="days" role="group" aria-label="Day">
  <button class="day" aria-pressed="false">Tue<span class="n">14</span><span class="mo">Oct</span></button>
  <button class="day" aria-pressed="false">Wed<span class="n">15</span><span class="mo">Oct</span></button>
  <button class="day" aria-pressed="true">Thu<span class="n">16</span><span class="mo">Oct</span></button>
  <button class="day" aria-pressed="false">Fri<span class="n">17</span><span class="mo">Oct</span></button>
  <button class="day" aria-pressed="false">Sat<span class="n">18</span><span class="mo">Oct</span></button>
</div>
<h2>Choose a time</h2>
<div class="grid" role="group" aria-label="Time">
  <button class="slot" aria-pressed="false" disabled>10:00 AM</button>
  <button class="slot" aria-pressed="false">11:30 AM</button>
  <button class="slot" aria-pressed="false">1:00 PM</button>
  <button class="slot" aria-pressed="true">2:30 PM</button>
  <button class="slot" aria-pressed="false">4:00 PM</button>
  <button class="slot" aria-pressed="false" disabled>5:30 PM</button>
</div>
</body></html>
