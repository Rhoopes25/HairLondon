<!-- @dsCard group="Navigation" height=230 subtitle="Main header, and the booking header with a way home" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:24px;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:460px;display:grid;gap:var(--space-5)}
.cap{font-size:.75rem;color:var(--ink-soft);margin:0 0 .4rem}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem;background:rgba(251,247,239,.92);border-bottom:1px solid var(--gold-soft);border-top:1px solid var(--gold-soft)}
.logo{display:inline-flex;color:var(--gold-deep)}
.logo svg{width:1.4rem;height:1.4rem}
.nav{display:flex;gap:1.35rem;align-items:center}
.nav a{font-size:.95rem;color:var(--ink-soft);text-decoration:none;letter-spacing:.01em}
.nav a.active{color:var(--gold-deep);font-weight:500}
.nav a:hover{color:var(--gold-deep)}
.nav a:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.book{font:500 .8rem/1.6 var(--font-sans);letter-spacing:.03em;color:var(--white);background:var(--gold-deep);padding:.55rem 1.1rem;border-radius:var(--radius-pill);text-decoration:none}
.book:hover{background:var(--ink)}
.x{display:inline-flex;width:1.3rem;height:1.3rem;color:var(--ink)}.x svg{width:100%;height:100%}.with{font-size:.9rem}.with strong{font-weight:500}
</style></head><body>
<div><p class="cap">Main header (Home, Stylists, profile)</p>
<header class="hdr"><a href="#" class="logo" aria-label="Local Locks, home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></a>
<nav class="nav"><a href="#">Home</a><a href="#" class="active" aria-current="page">Stylists</a></nav></header></div>
<div><p class="cap">Booking header: exit, who you're booking with, home</p>
<header class="hdr"><a href="#" class="x" aria-label="Exit booking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></a>
<span class="with">Booking with <strong>London</strong></span>
<a href="#" class="logo" aria-label="Local Locks, home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></a></header></div>
</body></html>
