<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylist | Hair by London</title>
    <meta name="description" content="See this stylist’s work, services, and reviews, then book.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-frame">
        <header class="site-header site-header--split">
            <a href="index.html" class="logo" aria-label="Hair by London, home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            </a>
            <nav class="header-nav" aria-label="Main">
                <a href="index.html" class="header-nav-link">Home</a>
                <a href="stylists.html" class="header-nav-link active" id="nav-stylists">Stylists</a>
            </nav>
        </header>

        <main id="profile-main">
            <a href="stylists.html" class="back-link" id="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><polyline points="15 6 9 12 15 18"/></svg>
                Back to stylists
            </a>
            <section class="profile">
                <div class="profile-top">
                    <span id="profile-avatar"></span>
                    <div>
                        <h1 id="profile-name"></h1>
                        <p class="profile-studio" id="profile-studio"></p>
                        <p class="rating-line" id="profile-rating"></p>
                    </div>
                </div>
                <p class="profile-bio" id="profile-bio"></p>

                <div class="tab-row">
                    <div class="tabs" role="tablist" aria-label="Profile sections">
                        <button type="button" class="tab" role="tab" id="tab-portfolio" aria-controls="panel-portfolio">Portfolio</button>
                        <button type="button" class="tab" role="tab" id="tab-services" aria-controls="panel-services">Services</button>
                        <button type="button" class="tab" role="tab" id="tab-reviews" aria-controls="panel-reviews">Reviews</button>
                    </div>
                </div>
            </section>

            <section class="tab-panel" role="tabpanel" id="panel-portfolio" aria-labelledby="tab-portfolio">
                <div class="work-grid" id="work-grid"></div>
            </section>

            <section class="tab-panel" role="tabpanel" id="panel-services" aria-labelledby="tab-services" hidden>
                <p class="price-note">Prices are starting points. Longer or thicker hair can cost more, and times are estimates.</p>
                <div class="service-rows" id="service-rows"></div>
            </section>

            <section class="tab-panel" role="tabpanel" id="panel-reviews" aria-labelledby="tab-reviews" hidden>
                <div class="reviews">
                    <div class="reviews-header">
                        <h2>Reviews</h2>
                    </div>
                    <p class="rating-summary" id="reviews-rating"></p>
                    <div id="review-list"></div>
                </div>
            </section>

            <!-- The one Book action on this screen. Always in reach. -->
            <div class="book-bar" id="book-bar">
                <div class="book-bar-info">
                    <span class="book-bar-services" id="bar-services"></span>
                    <span class="book-bar-meta" id="bar-meta"></span>
                    <span class="book-bar-time" id="bar-time" hidden></span>
                </div>
                <a href="#" class="book-bar-btn" id="bar-book">Book</a>
            </div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Hair by London</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const stylist = getStylist(params.get('id'));
        if (!stylist) {
            location.replace('stylists.html');
            throw new Error('Unknown stylist');
        }

        // Only keep services this stylist actually offers
        const selectedServices = parseServiceIds(params.get('services') || params.get('service'))
            .filter(id => stylist.services[id] != null);

        // A time she tapped on the Stylists page, if it's still open
        let heldDate = parseDateKey(params.get('date'));
        let heldStart = Number(params.get('start'));
        const heldDuration = Math.max(durationFor(selectedServices), STEP);
        if (!heldDate || !Number.isFinite(heldStart) || !isStartAvailable(stylist, heldDate, heldStart, heldDuration)) {
            heldDate = null;
            heldStart = null;
        }

        function bookingHref(extraId) {
            const ids = selectedServices.slice();
            if (extraId && !ids.includes(extraId)) ids.push(extraId);
            let url = 'booking.html?stylist=' + stylist.id;
            if (ids.length) url += '&' + servicesQuery(ids);
            if (heldDate && !extraId) url += '&date=' + dateKey(heldDate) + '&start=' + heldStart;
            else if (pickedDay) url += '&date=' + dateKey(pickedDay);
            return url;
        }

        // A day she picked in the Stylists filters (if this stylist works that day)
        const pickedDay = parseDateKey(params.get('day'));

        // Back to the same search she came from
        const searchUrl = lastSearchUrl();
        document.getElementById('back-link').href = searchUrl;
        document.getElementById('nav-stylists').href = searchUrl;

        const bookUrl = bookingHref();
        document.title = stylist.name + ' | Hair by London';

        // Header
        document.getElementById('profile-avatar').outerHTML = avatarHTML(stylist, 'lg');
        document.getElementById('profile-name').textContent = stylist.name;
        document.getElementById('profile-studio').textContent = stylist.studio + ', ' + stylist.city;
        document.getElementById('profile-rating').innerHTML = ratingHTML(stylist);
        document.getElementById('profile-bio').textContent = stylist.bio;
        // Sticky bar: her services, starting price, estimated time, and held time.
        // With nothing picked yet, it shows the starting price and she picks services next.
        if (selectedServices.length) {
            document.getElementById('bar-services').textContent = selectedServices.map(id => SERVICES[id].name).join(' + ');
            document.getElementById('bar-meta').textContent =
                priceText(priceFor(stylist, selectedServices)) + ' \u00b7 about ' + formatDuration(durationFor(selectedServices));
            if (heldDate) {
                const t = document.getElementById('bar-time');
                t.hidden = false;
                t.textContent = formatDay(heldDate) + ' at ' + formatTime(heldStart);
            }
        } else {
            document.getElementById('bar-services').textContent = 'Services from ' + priceText(startingPrice(stylist));
            document.getElementById('bar-meta').textContent = 'Pick services, a day, and a time next';
        }
        const barBook = document.getElementById('bar-book');
        barBook.href = bookUrl;
        barBook.textContent = 'Book with ' + stylist.name.split(' ')[0];

        // Portfolio
        const grid = document.getElementById('work-grid');
        if (stylist.portfolio.length) {
            stylist.portfolio.forEach(p => {
                grid.insertAdjacentHTML('beforeend',
                    '<figure class="work-card"><div class="work-card-photo">' +
                    '<img src="' + p.src + '" alt="' + escapeHTML(p.alt) + '" loading="lazy" onerror="this.style.display=\'none\'">' +
                    '</div></figure>');
            });
        } else {
            grid.insertAdjacentHTML('beforebegin', '<p class="panel-note">' + escapeHTML(stylist.name.split(' ')[0]) + ' hasn\u2019t added photos yet. Check the reviews to see what clients say.</p>');
        }

        // Services
        const rows = document.getElementById('service-rows');
        Object.entries(stylist.services).forEach(([id, price]) => {
            const svc = SERVICES[id];
            rows.insertAdjacentHTML('beforeend',
                '<a class="service-row" href="' + bookingHref(id) + '">' +
                '<span class="service-row-body">' +
                '<span class="service-name">' + svc.name + '</span>' +
                '<span class="service-desc">' + svc.description + '</span>' +
                '</span>' +
                '<span class="service-meta">' + formatDuration(svc.duration) + ' \u00b7 ' + priceText(price) + '</span>' +
                '<svg class="service-row-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>' +
                '</a>');
        });

        // Reviews
        document.getElementById('reviews-rating').innerHTML = ratingHTML(stylist);
        const reviewList = document.getElementById('review-list');
        stylist.reviews.forEach(r => {
            reviewList.insertAdjacentHTML('beforeend',
                '<div class="review"><div class="review-top"><strong>' + escapeHTML(r.name) + '</strong>' +
                '<span class="stars" role="img" aria-label="' + r.stars + ' out of 5 stars">' + starsHTML(r.stars) + '</span></div>' +
                escapeHTML(r.text) + '</div>');
        });

        // Tabs
        const tabs = [...document.querySelectorAll('.tab')];
        function selectTab(tab, focus) {
            tabs.forEach(t => {
                const on = t === tab;
                t.setAttribute('aria-selected', on);
                t.tabIndex = on ? 0 : -1;
                document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
            });
            if (focus) tab.focus();
        }
        tabs.forEach((t, i) => {
            t.addEventListener('click', () => selectTab(t));
            t.addEventListener('keydown', e => {
                if (e.key === 'ArrowRight') selectTab(tabs[(i + 1) % tabs.length], true);
                if (e.key === 'ArrowLeft') selectTab(tabs[(i - 1 + tabs.length) % tabs.length], true);
            });
        });
        // Lead with the work (that's what builds trust). Reviews first if there are no photos yet.
        selectTab(stylist.portfolio.length ? tabs[0] : tabs[2]);
    </script>
    <script src="prototype-notice.js"></script>
</body>

</html>
