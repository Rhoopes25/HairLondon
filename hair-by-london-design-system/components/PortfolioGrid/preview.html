<!-- @dsCard group="Trust" height=420 subtitle="Two-column photo tiles with the warm placeholder" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:24px 1.5rem;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:460px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.card{margin:0;border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-card);display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;background:linear-gradient(145deg,var(--photo-light),var(--photo-deep))}
.a{background:linear-gradient(145deg,var(--gold-soft),var(--gold-deep))}
.b{background:linear-gradient(145deg,var(--cream-deep),var(--gold))}
.c{background:linear-gradient(145deg,var(--gold-soft),var(--gold))}
.note{font-size:.75rem;color:var(--ink-soft);margin:1rem 0 0}
</style></head><body>
<div class="grid" role="list" aria-label="Photos of recent work">
<figure class="card" role="listitem"><div class="ph a"></div></figure>
<figure class="card" role="listitem"><div class="ph b"></div></figure>
<figure class="card" role="listitem"><div class="ph"></div></figure>
<figure class="card" role="listitem"><div class="ph c"></div></figure>
</div>
<p class="note">Placeholders. Real photos replace the gradient at the same 4:5 crop and radius.</p>
</body></html>
