<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:24px 1.5rem;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:460px}
h1{font:500 1.7rem/1.6 var(--font-display);margin:0}
.rate{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--ink-soft);margin:0 0 .9rem}
.stars{color:var(--gold-deep);font-size:.8rem;letter-spacing:1px}
.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gold-soft)}
.tabs{display:flex;gap:1.35rem}
.tab{font-size:.95rem;color:var(--ink-soft);text-decoration:none;padding:.7rem 0;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);font-weight:500;border-bottom-color:var(--gold-deep)}
.book{font:500 .8rem/1.6 var(--font-sans);letter-spacing:.03em;color:var(--white);background:var(--gold-deep);padding:.55rem 1.1rem;border:0;border-radius:var(--radius-pill);cursor:pointer}
.book:hover{background:var(--ink)}
.tab:focus-visible,.book:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
</style></head><body>
<h1>Hair by London</h1>
<p class="rate"><span class="stars" role="img" aria-label="4.7 out of 5 stars">&#9733;&#9733;&#9733;&#9733;&#9734;</span><span>4.7 &middot; 3 reviews</span></p>
<div class="row">
  <nav class="tabs" aria-label="Profile sections"><a href="#" class="tab active" aria-current="page">Services</a><a href="#" class="tab">Portfolio</a><a href="#" class="tab">Reviews</a></nav>
  <button class="book">Book</button>
</div>
</body></html>
