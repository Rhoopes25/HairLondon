<!-- @dsCard group="Trust" height=400 subtitle="One white card: rating line and divided reviews (sample text)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:24px 1.5rem;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:460px}
.card{padding:1.25rem 1.3rem;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--gold-soft)}
h2{font:600 1.2rem/1.6 var(--font-display);margin:0}
.rate{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--ink-soft);margin:0 0 .85rem}
.stars{color:var(--gold-deep);font-size:.8rem;letter-spacing:1px}
.rv{font-size:.85rem;color:var(--ink-soft);padding:.7rem 0;border-top:1px solid var(--cream-deep)}
.rv.first{border-top:0;padding-top:0}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.15rem}
.top strong{font-weight:500;color:var(--ink);font-size:1rem}
</style></head><body>
<div class="card">
<h2>Reviews</h2>
<p class="rate"><span class="stars" role="img" aria-label="4.7 out of 5 stars">&#9733;&#9733;&#9733;&#9733;&#9734;</span><span>4.7 &middot; 3 reviews</span></p>
<div class="rv first"><div class="top"><strong>Maren T.</strong><span class="stars" role="img" aria-label="5 out of 5 stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span></div>Finally found someone I trust with my hair. Booked during nap time and it took two minutes.</div>
<div class="rv"><div class="top"><strong>Priya S.</strong><span class="stars" role="img" aria-label="5 out of 5 stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span></div>Exactly what I asked for, first try. Easy to book around my schedule too.</div>
<div class="rv"><div class="top"><strong>Elise K.</strong><span class="stars" role="img" aria-label="4 out of 5 stars">&#9733;&#9733;&#9733;&#9733;&#9734;</span></div>Relaxed, no pressure, and my color has never looked better.</div>
</div>
</body></html>
