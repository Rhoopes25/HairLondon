<!-- @dsCard group="Trust" height=620 subtitle="Landing photo, italic name, tagline, one big button" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;padding:1.75rem 1.25rem 24px;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;max-width:460px}
.hero{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;display:flex;align-items:flex-end;background:linear-gradient(145deg,var(--photo-light),var(--photo-deep))}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 45%),radial-gradient(circle at 75% 75%,rgba(169,128,63,.35),transparent 55%)}
.ov{position:relative;width:100%;padding:2rem 1.5rem 2.25rem;background:linear-gradient(to top,rgba(43,36,32,.72) 0%,rgba(43,36,32,.15) 70%,transparent 100%);color:var(--white);text-align:center;display:flex;flex-direction:column;align-items:center}
h1{font:italic 500 2.5rem/1.15 var(--font-display);margin:0 0 1.1rem}
.cta{display:inline-block;font:500 .85rem/1.6 var(--font-sans);letter-spacing:.03em;color:var(--ink);background:var(--white);padding:.75rem 1.6rem;border-radius:var(--radius-pill);text-decoration:none;transition:transform .15s ease,background .2s ease}
.cta:hover{background:var(--gold-soft);transform:translateY(-1px)}
.cta:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.note{font-size:.75rem;color:var(--ink-soft);margin:.75rem 0 0}
.tag{font-size:1rem;line-height:1.45;margin:-.4rem 0 1.4rem;max-width:26ch;color:rgba(255,255,255,.95)}
.cta{font-size:1.05rem!important;font-weight:600!important;padding:1rem 2.4rem!important;box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style></head><body>
<section class="hero"><div class="ov"><h1>Hair by London</h1><p class="tag">See real work from local stylists, then book a time that fits your day.</p><a href="#" class="cta">Find a stylist</a></div></section>
<p class="note">A warm gradient stands in for home.jpg.</p>
</body></html>
