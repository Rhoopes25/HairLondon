<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Locks | Find a stylist you trust</title>
    <meta
      name="description"
      content="See real client work, compare stylists, and book in minutes. An early prototype."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A9803F' stroke-width='1.6'%3E%3Ccircle cx='6' cy='6' r='3'/%3E%3Ccircle cx='6' cy='18' r='3'/%3E%3Cline x1='20' y1='4' x2='8.12' y2='15.88'/%3E%3Cline x1='14.47' y1='14.48' x2='20' y2='20'/%3E%3Cline x1='8.12' y1='8.12' x2='12' y2='12'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap"
    />
    <!-- Microsoft Clarity: one tag here covers every route, since the app is a single page -->
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = 'https://www.clarity.ms/tag/' + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, 'clarity', 'script', 'yxp5e59u8k');
    </script>
    <!-- Google Analytics 4. The app uses hash routes (#/stylists), which GA4 doesn't see as
         new pages on its own, so we send a page_view with the hash route each time it changes. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLTGWG1DK4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-BLTGWG1DK4', { send_page_view: false });
      function sendPageView() {
        var route = (location.hash || '#/').replace(/^#/, '').split('?')[0];
        gtag('event', 'page_view', {
          page_location: location.origin + location.pathname + '#' + route,
          page_path: location.pathname + '#' + route,
          page_title: document.title,
        });
      }
      sendPageView();
      window.addEventListener('hashchange', sendPageView);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
