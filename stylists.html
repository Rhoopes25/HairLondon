<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylists | Local Locks</title>
    <meta name="description" content="Browse each local stylist and open their profile.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-frame">
        <header class="site-header site-header--split">
            <div class="header-brand">
                <a href="index.html" class="header-nav-link">Home</a>
                <a href="index.html" class="logo" aria-label="Local Locks, home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
                </a>
            </div>
            <nav class="header-nav" aria-label="Main">
                <a href="book.html" class="header-nav-link">Book</a>
                <a href="stylists.html" class="header-nav-link active" aria-current="page">Stylists</a>
                <a href="appointments.html" class="header-nav-link">Appointments</a>
            </nav>
        </header>

        <main>
            <section class="page-intro">
                <h1>Stylists</h1>
                <p>Meet the local stylists behind the work, then choose the one you want to book with.</p>
            </section>

            <section class="stylist-list" id="stylist-list" aria-label="Stylists"></section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Local Locks</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script>
        const list = document.getElementById('stylist-list');

        function stylistCard(stylist) {
            const base = 'stylist.html?id=' + stylist.id + '&from=stylists';
            const firstName = stylist.name.split(' ')[0];
            const shown = stylist.portfolio.slice(0, 3);
            const thumbs = shown.map((p, i) =>
                '<span class="card-thumb' + (i === 2 ? ' card-thumb--more' : '') + '">' +
                '<img src="' + p.src + '" alt="" loading="lazy" onerror="this.remove()">' +
                '</span>').join('');
            const slots = openSlots(stylist, 60, upcomingDays(), null, 3)
                .map(slot => '<a class="slot-chip" href="booking.html?stylist=' + stylist.id + '&date=' + dateKey(slot.date) + '&start=' + slot.start + '&from=search" aria-label="Book ' + escapeHTML(stylist.name) + ', ' + formatDay(slot.date) + ' at ' + formatTime(slot.start) + '">' +
                    (dateKey(slot.date) === dateKey(todayAtMidnight()) ? 'Today' : WEEKDAYS[slot.date.getDay()] + ' ' + slot.date.getDate()) + ', ' + formatTime(slot.start) +
                '</a>').join('');

            return '<article class="stylist-card stylist-card--rich">' +
                '<div class="card-top">' +
                avatarHTML(stylist) +
                '<div class="stylist-card-body">' +
                '<a class="stylist-card-name card-link" href="' + base + '">' + escapeHTML(stylist.name) + '</a>' +
                '<span class="stylist-card-studio">' + escapeHTML(stylist.studio) + ', ' + escapeHTML(stylist.city) + '</span>' +
                '<span class="stylist-card-meta rating-line">' + ratingHTML(stylist) + '</span>' +
                '</div>' +
                '<div class="card-price-wrap"><span class="card-price-note">from</span><span class="card-price">' + priceText(startingPrice(stylist)) + '</span></div>' +
                '</div>' +
                '<div class="card-thumbs">' + thumbs + '</div>' +
                '<div class="card-slots"><span class="card-slots-label">Next open</span><div class="slot-row">' + slots + '</div></div>' +
                '<div class="portfolio-cta"><a href="' + base + '">View profile</a></div>' +
                '</article>';
        }

        list.innerHTML = STYLISTS.map(stylistCard).join('');
    </script>
</body>

</html>
