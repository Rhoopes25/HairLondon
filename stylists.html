<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylists | Hair by London</title>
    <meta name="description" content="Browse stylists near you by service, see their work, and book.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-frame">
        <header class="site-header site-header--split">
            <a href="index.html" class="logo" aria-label="Hair by London, home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            </a>
            <nav class="header-nav" aria-label="Main">
                <a href="index.html" class="header-nav-link">Home</a>
                <a href="stylists.html" class="header-nav-link active" aria-current="page">Stylists</a>
            </nav>
        </header>

        <main>
            <section class="page-intro">
                <h1>Find a stylist</h1>
                <p>Browse their work and reviews, then book a time that fits your day.</p>
            </section>

            <section class="filter-section" aria-label="Filter by service">
                <div class="chip-scroll" id="filter-chips"></div>
            </section>

            <section class="stylist-list" id="stylist-list" aria-live="polite"></section>
        </main>

        <footer class="site-footer">
            <div class="social-links">
                <a href="#" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
                </a>
                <a href="#" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 3h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h2.5l.5-4H13V7a1 1 0 0 1 1-1h2z"/></svg>
                </a>
                <a href="#" aria-label="TikTok">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5c.36 0 .7.05 1 .15V7.7a7 7 0 1 0 6 6.93V9.5a6 6 0 0 0 3-1V5.5a5 5 0 0 1-3.5-2.5H14z"/></svg>
                </a>
            </div>
            <p>&copy; 2026 Hair by London</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        let activeService = SERVICES[params.get('service')] ? params.get('service') : 'all';

        const chipsWrap = document.getElementById('filter-chips');
        const list = document.getElementById('stylist-list');

        function renderChips() {
            chipsWrap.innerHTML = '';
            const options = [['all', 'All services'], ...Object.entries(SERVICES).map(([id, s]) => [id, s.name])];
            options.forEach(([id, label]) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'filter-chip' + (id === activeService ? ' selected' : '');
                b.textContent = label;
                b.setAttribute('aria-pressed', id === activeService);
                b.addEventListener('click', () => {
                    activeService = id;
                    const url = id === 'all' ? 'stylists.html' : 'stylists.html?service=' + id;
                    history.replaceState(null, '', url);
                    renderChips();
                    renderList();
                });
                chipsWrap.appendChild(b);
            });
            const sel = chipsWrap.querySelector('.selected');
            if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'center' });
        }

        function renderList() {
            const matches = STYLISTS.filter(s => activeService === 'all' || s.services[activeService] != null);
            list.innerHTML = '';

            if (!matches.length) {
                list.innerHTML = '<p class="empty-note">No stylists offer that service yet. Try another one.</p>';
                return;
            }

            matches.forEach(s => {
                const priceText = activeService === 'all' ?
                    'From $' + startingPrice(s) :
                    SERVICES[activeService].name + ' $' + s.services[activeService];
                const link = 'stylist.html?id=' + s.id + (activeService !== 'all' ? '&service=' + activeService : '');

                const card = document.createElement('a');
                card.className = 'stylist-card';
                card.href = link;
                card.innerHTML =
                    avatarHTML(s) +
                    '<span class="stylist-card-body">' +
                    '<span class="stylist-card-name">' + escapeHTML(s.name) + '</span>' +
                    '<span class="stylist-card-studio">' + escapeHTML(s.studio) + ', ' + escapeHTML(s.city) + '</span>' +
                    '<span class="stylist-card-meta rating-line">' +
                    ratingHTML(s) +
                    '</span>' +
                    '</span>' +
                    '<span class="stylist-card-price">' + priceText + '</span>';
                list.appendChild(card);
            });
        }

        renderChips();
        renderList();
    </script>
</body>

</html>
