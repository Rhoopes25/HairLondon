<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a service | Hair by London</title>
    <meta name="description" content="Pick one or more services, then choose a stylist who can do them.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-frame">
        <header class="site-header site-header--split">
            <a href="index.html" class="logo" aria-label="Hair by London, home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            </a>
            <nav class="header-nav" aria-label="Main">
                <a href="index.html" class="header-nav-link">Home</a>
                <a href="stylists.html" class="header-nav-link">Stylists</a>
            </nav>
        </header>

        <main>
            <section class="page-intro">
                <h1>Choose a service</h1>
                <p>Select everything you want done. You can pick more than one.</p>
            </section>

            <section class="booking-section">
                <h2>Services</h2>
                <div class="service-list" id="service-list"></div>
            </section>

            <div class="confirm-bar">
                <div class="confirm-summary">
                    <span id="summary-line">Select at least one service</span>
                </div>
                <button type="button" class="confirm-btn" id="continue-btn" disabled>Continue</button>
            </div>
        </main>

        <footer class="site-footer">
            <div class="social-links">
                <a href="#" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
                </a>
                <a href="#" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 3h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h2.5l.5-4H13V7a1 1 0 0 1 1-1h2z"/></svg>
                </a>
                <a href="#" aria-label="TikTok">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5c.36 0 .7.05 1 .15V7.7a7 7 0 1 0 6 6.93V9.5a6 6 0 0 0 3-1V5.5a5 5 0 0 1-3.5-2.5H14z"/></svg>
                </a>
            </div>
            <p>&copy; 2026 Hair by London</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script>
        const selected = [];
        const serviceList = document.getElementById('service-list');
        const summaryLine = document.getElementById('summary-line');
        const continueBtn = document.getElementById('continue-btn');

        Object.entries(SERVICES).forEach(([id, svc]) => {
            const range = priceRange(id);
            const price = !range ? '' :
                (range.min === range.max ? '$' + range.min : '$' + range.min + '\u2013' + range.max);
            serviceList.insertAdjacentHTML('beforeend',
                '<label class="service-option">' +
                '<input type="checkbox" name="service" value="' + id + '" class="service-input">' +
                '<span class="service-check" aria-hidden="true"></span>' +
                '<span class="service-body">' +
                '<span class="service-name">' + svc.name + '</span>' +
                '<span class="service-desc">' + svc.description + '</span>' +
                '</span>' +
                '<span class="service-meta">' + formatDuration(svc.duration) + (price ? ' \u00b7 ' + price : '') + '</span>' +
                '</label>');
        });

        function updateSummary() {
            if (!selected.length) {
                summaryLine.textContent = 'Select at least one service';
                continueBtn.disabled = true;
                return;
            }
            summaryLine.textContent = selected.map(id => SERVICES[id].name).join(' + ');
            continueBtn.disabled = false;
        }

        serviceList.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', () => {
                if (input.checked) selected.push(input.value);
                else selected.splice(selected.indexOf(input.value), 1);
                updateSummary();
            });
        });

        parseServiceIds(new URLSearchParams(location.search).get('services')).forEach(id => {
            const input = serviceList.querySelector('input[value="' + id + '"]');
            if (!input) return;
            input.checked = true;
            selected.push(id);
        });

        continueBtn.addEventListener('click', () => {
            if (!selected.length) return;
            location.href = 'stylists.html?' + servicesQuery(selected);
        });

        updateSummary();
    </script>
</body>

</html>
